<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <style>

    </style>
    <section>

        <div class="main-box">
<header id="header">
    <div class="logo">
        <img src="logo.png" width="5%">
        <h1 style="line-height: 25px;">
            Contact Manager
            <br>
            <span style="font-size: 16px;">Add, Search , manage your Contacts easily !</span>
        </h1>
    </div>


    
</header>



<div class="input-wala">
    <input id="search-wala" type="text" placeholder="Search Contact">
  <button id="all">Search</button>
    <div class="buttons">
      
        <button id="Friends">Friends</button>
        <button id="Family">Family</button>
        <button id="work">
            Work
        </button>
    </div>
</div>



<div class="bannar">
<div class="input-wala">

    <input type="file" id="contact-image" accept="image/*" hidden>

    <label for="contact-image" class="upload-circle">
        <i class="fa-solid fa-camera"></i>
    </label>

</div>


<form>
<div class="m-input">
    <input type="text" placeholder="Name"  id="name">
      <input id="email" type="text" placeholder="Email">
        <input type="text" placeholder="Phone" id="phone">
          <select id="category">
    <option value="" disabled selected> Category</option>
    <option value="work">Work</option>
    <option value="family">Family</option>
    <option value="friends">Friends</option>
</select>
    <input id="addd" type="submit" value="ADD">
         
</div>

</form>
</div>



<div class="cards">
    
</div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
